name: Build Windows Aseprite (personal draft)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve latest stable source
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/aseprite/aseprite/releases/latest | ConvertFrom-Json
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ steps.version.outputs.tag }}
          submodules: recursive
          path: source
      - uses: aseprite/get-ninja@main
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Obtain source-matched Skia
        shell: bash
        run: |
          set -euo pipefail
          skia_url=$(bash source/laf/misc/skia-url.sh release windows x64)
          curl --fail --location --retry 3 "$skia_url" --output skia.zip
          unzip -q skia.zip -d skia
      - name: Configure with Lua scripting
        shell: pwsh
        run: |
          cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAF_BACKEND=skia -DENABLE_SCRIPTING=ON -DENABLE_TESTS=OFF "-DSKIA_DIR=$env:GITHUB_WORKSPACE/skia" "-DSKIA_LIBRARY_DIR=$env:GITHUB_WORKSPACE/skia/out/Release-x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target aseprite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Lua and package portable build
        shell: pwsh
        run: |
          'print("ASEPRITE_LUA_OK", app.version)' | Set-Content lua-check.lua -Encoding utf8
          & ./build/bin/aseprite.exe -b --script lua-check.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '# Portable self-compiled Aseprite' | Set-Content build/bin/aseprite.ini -Encoding ascii
          Compress-Archive -Path build/bin/* -DestinationPath Aseprite-Windows-x64.zip
          Get-FileHash Aseprite-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File SHA256.txt
      - name: Store personal draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = "personal-$env:SOURCE_TAG-$env:GITHUB_RUN_ID"
          gh release create $tag Aseprite-Windows-x64.zip SHA256.txt --draft --target "${{ github.sha }}" --title "Personal Aseprite $env:SOURCE_TAG Windows x64" --notes "Self-compiled from official Aseprite source, with Lua enabled. Personal draft; do not publish. Workflow adapted from ellisonoswalt/aseprite_builder."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
